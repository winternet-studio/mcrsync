# Test rig for mcrsync - see test/README.md
name: mcrsync-test

services:
  keygen:
    image: alpine:3.20
    volumes:
      - keys:/keys
    command: >
      sh -c "apk add --no-cache openssh-keygen >/dev/null &&
             [ -f /keys/id_test ] || ssh-keygen -q -t ed25519 -N '' -f /keys/id_test &&
             chmod 644 /keys/id_test /keys/id_test.pub"

  remote-alpine:
    build:
      context: .
      dockerfile: remote/Dockerfile.alpine
    volumes:
      - keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully

  remote-debian:
    build:
      context: .
      dockerfile: remote/Dockerfile.debian
    volumes:
      - keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully

  # S3 object storage for the rclone tests (key test / secret testsecret)
  rclone-s3:
    build:
      context: .
      dockerfile: rclone-server/Dockerfile
    command: ["serve", "s3", "/data", "--addr", ":9000", "--auth-key", "test,testsecret"]

  # WebDAV without modification times, for the rclone --update warning
  rclone-dav:
    build:
      context: .
      dockerfile: rclone-server/Dockerfile
    command: ["serve", "webdav", "/data", "--addr", ":8080"]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - keys:/keys:ro
      - ..:/app:ro
      - ../screenshots:/screenshots
    environment:
      MCRSYNC_TEST_HOSTS: "remote-alpine remote-debian"
      MCRSYNC_TEST_RCLONE: "s3=http://rclone-s3:9000 dav=http://rclone-dav:8080"
    stdin_open: true
    tty: true
    depends_on:
      - remote-alpine
      - remote-debian
      - rclone-s3
      - rclone-dav

volumes:
  keys:
